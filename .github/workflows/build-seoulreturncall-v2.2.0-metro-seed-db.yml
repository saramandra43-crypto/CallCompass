        uses: actions/upload-artifact@v4
        with:
          name: SeoulReturnCall-v2.2.0-MetroSeedDB-apk
          path: project/SeoulReturnCall_v2.2.0_MetroSeedDB/app/build/outputs/apk/debug/app-debug.apk
