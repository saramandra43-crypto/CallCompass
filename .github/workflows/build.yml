name: Build CallCompass APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/callcompass/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CallCompass"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          mkdir -p app

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.callcompass.app'
              compileSdk 35

              defaultConfig {
                  applicationId "com.callcompass.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName "0.1"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="true"
                  android:label="콜나침반"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/callcompass/app/MainActivity.java <<'EOF'
          package com.callcompass.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.location.Address;
          import android.location.Geocoder;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity implements LocationListener {

              private static final int LOCATION_REQUEST = 1001;

              private LinearLayout pointContainer;
              private TextView locationText;
              private TextView statusText;

              private LocationManager locationManager;

              private double currentLat;
              private double currentLon;
              private boolean hasLocation = false;

              private int radiusKm = 5;

              private final List<CallPoint> points = new ArrayList<>();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  createSamplePoints();
                  createScreen();

                  locationManager =
                          (LocationManager) getSystemService(LOCATION_SERVICE);

                  requestLocation();
              }

              private void createScreen() {

                  ScrollView scrollView = new ScrollView(this);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(18), dp(22), dp(18), dp(30));
                  root.setBackgroundColor(Color.rgb(246, 247, 250));

                  scrollView.addView(root);

                  TextView title = text(
                          "🧭 콜나침반",
                          28,
                          true,
                          Color.rgb(25, 32, 45)
                  );

                  root.addView(title);

                  TextView subtitle = text(
                          "현재 위치에서 갈 만한 콜 포인트 찾기",
                          15,
                          false,
                          Color.DKGRAY
                  );

                  subtitle.setPadding(0, dp(3), 0, dp(14));
                  root.addView(subtitle);

                  TextView sample = text(
                          "v0.1 샘플 · 실시간 콜 수신 기능 아님",
                          12,
                          false,
                          Color.rgb(100, 100, 100)
                  );

                  sample.setPadding(0, 0, 0, dp(12));
                  root.addView(sample);

                  LinearLayout locationCard = new LinearLayout(this);
                  locationCard.setOrientation(LinearLayout.VERTICAL);
                  locationCard.setPadding(dp(16), dp(14), dp(16), dp(14));
                  locationCard.setBackground(cardBackground(Color.WHITE));

                  locationText = text(
                          "📍 현재 위치 확인 중...",
                          18,
                          true,
                          Color.rgb(30, 30, 30)
                  );

                  statusText = text(
                          "위치 권한을 확인하고 있어요.",
                          13,
                          false,
                          Color.GRAY
                  );

                  statusText.setPadding(0, dp(5), 0, 0);

                  locationCard.addView(locationText);
                  locationCard.addView(statusText);

                  root.addView(locationCard, marginParams(0, 0, 0, 14));

                  Button refresh = new Button(this);
                  refresh.setText("📡 GPS 위치 새로고침");
                  refresh.setAllCaps(false);

                  refresh.setOnClickListener(v -> requestLocation());

                  root.addView(refresh, marginParams(0, 0, 0, 8));

                  TextView rangeLabel = text(
                          "검색 반경",
                          15,
                          true,
                          Color.DKGRAY
                  );

                  rangeLabel.setPadding(0, dp(8), 0, dp(6));
                  root.addView(rangeLabel);

                  LinearLayout ranges = new LinearLayout(this);
                  ranges.setOrientation(LinearLayout.HORIZONTAL);

                  Button b3 = rangeButton("3km", 3);
                  Button b5 = rangeButton("5km", 5);
                  Button b10 = rangeButton("10km", 10);

                  ranges.addView(
                          b3,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );

                  ranges.addView(
                          b5,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );

                  ranges.addView(
                          b10,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(48),
                                  1
                          )
                  );

                  root.addView(ranges);

                  TextView resultTitle = text(
                          "추천 콜지",
                          21,
                          true,
                          Color.rgb(25, 32, 45)
                  );

                  resultTitle.setPadding(0, dp(20), 0, dp(8));
                  root.addView(resultTitle);

                  pointContainer = new LinearLayout(this);
                  pointContainer.setOrientation(LinearLayout.VERTICAL);

                  root.addView(pointContainer);

                  setContentView(scrollView);
              }

              private Button rangeButton(String title, int km) {

                  Button button = new Button(this);
                  button.setText(title);
                  button.setAllCaps(false);

                  button.setOnClickListener(v -> {
                      radiusKm = km;
                      updatePoints();
                  });

                  return button;
              }

              private void requestLocation() {

                  if (checkSelfPermission(
                          Manifest.permission.ACCESS_FINE_LOCATION
                  ) != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              LOCATION_REQUEST
                      );

                      return;
                  }

                  findLocation();
              }

              private void findLocation() {

                  try {

                      statusText.setText("GPS 위치를 찾는 중...");

                      Location last = null;

                      if (locationManager.isProviderEnabled(
                              LocationManager.GPS_PROVIDER
                      )) {

                          last = locationManager.getLastKnownLocation(
                                  LocationManager.GPS_PROVIDER
                          );

                          locationManager.requestLocationUpdates(
                                  LocationManager.GPS_PROVIDER,
                                  2000,
                                  5,
                                  this
                          );
                      }

                      if (last == null &&
                              locationManager.isProviderEnabled(
                                      LocationManager.NETWORK_PROVIDER
                              )) {

                          last = locationManager.getLastKnownLocation(
                                  LocationManager.NETWORK_PROVIDER
                          );

                          locationManager.requestLocationUpdates(
                                  LocationManager.NETWORK_PROVIDER,
                                  2000,
                                  5,
                                  this
                          );
                      }

                      if (last != null) {
                          useLocation(last);
                      } else {
                          statusText.setText(
                                  "위치를 기다리는 중입니다. 야외에서 새로고침해 보세요."
                          );
                      }

                  } catch (Exception e) {

                      statusText.setText(
                              "GPS를 사용할 수 없습니다. 위치 설정을 확인해 주세요."
                      );
                  }
              }

              @Override
              public void onLocationChanged(Location location) {
                  useLocation(location);
              }

              private void useLocation(Location location) {

                  currentLat = location.getLatitude();
                  currentLon = location.getLongitude();

                  hasLocation = true;

                  locationText.setText(
                          String.format(
                                  Locale.KOREA,
                                  "📍 %.5f, %.5f",
                                  currentLat,
                                  currentLon
                          )
                  );

                  statusText.setText("현재 지역 이름을 확인하는 중...");

                  updatePoints();
                  reverseGeocode();

                  try {
                      locationManager.removeUpdates(this);
                  } catch (Exception ignored) {}
              }

              private void reverseGeocode() {

                  new Thread(() -> {

                      try {

                          Geocoder geocoder =
                                  new Geocoder(
                                          this,
                                          Locale.KOREA
                                  );

                          List<Address> result =
                                  geocoder.getFromLocation(
                                          currentLat,
                                          currentLon,
                                          1
                                  );

                          if (result != null &&
                                  !result.isEmpty()) {

                              Address a = result.get(0);

                              StringBuilder area =
                                      new StringBuilder();

                              if (a.getAdminArea() != null)
                                  area.append(a.getAdminArea());

                              if (a.getLocality() != null)
                                  area.append(" ")
                                          .append(a.getLocality());

                              if (a.getSubLocality() != null)
                                  area.append(" ")
                                          .append(a.getSubLocality());

                              if (a.getThoroughfare() != null)
                                  area.append(" ")
                                          .append(a.getThoroughfare());

                              runOnUiThread(() -> {

                                  locationText.setText(
                                          "📍 " + area
                                  );

                                  statusText.setText(
                                          "반경 " +
                                                  radiusKm +
                                                  "km 추천 콜지를 표시합니다."
                                  );
                              });

                          }

                      } catch (Exception e) {

                          runOnUiThread(() ->
                                  statusText.setText(
                                          "반경 " +
                                                  radiusKm +
                                                  "km 추천 콜지를 표시합니다."
                                  )
                          );
                      }

                  }).start();
              }

              private void updatePoints() {

                  pointContainer.removeAllViews();

                  if (!hasLocation) {

                      TextView empty = text(
                              "GPS 위치를 받아오면 주변 콜지가 여기에 표시됩니다.",
                              15,
                              false,
                              Color.GRAY
                      );

                      empty.setPadding(
                              dp(5),
                              dp(20),
                              dp(5),
                              dp(20)
                      );

                      pointContainer.addView(empty);
                      return;
                  }

                  List<ResultPoint> results =
                          new ArrayList<>();

                  for (CallPoint p : points) {

                      double distance =
                              distanceKm(
                                      currentLat,
                                      currentLon,
                                      p.lat,
                                      p.lon
                              );

                      int score =
                              (int) Math.round(
                                      p.baseScore -
                                              Math.min(
                                                      30,
                                                      distance * 2.3
                                              )
                              );

                      if (distance <= radiusKm) {

                          results.add(
                                  new ResultPoint(
                                          p,
                                          distance,
                                          score
                                  )
                          );
                      }
                  }

                  boolean outsideRadius = false;

                  if (results.isEmpty()) {

                      outsideRadius = true;

                      for (CallPoint p : points) {

                          double distance =
                                  distanceKm(
                                          currentLat,
                                          currentLon,
                                          p.lat,
                                          p.lon
                                  );

                          int score =
                                  (int) Math.round(
                                          p.baseScore -
                                                  Math.min(
                                                          30,
                                                          distance * 2.3
                                                  )
                                  );

                          results.add(
                                  new ResultPoint(
                                          p,
                                          distance,
                                          score
                                  )
                          );
                      }

                      Collections.sort(
                              results,
                              Comparator.comparingDouble(
                                      r -> r.distance
                              )
                      );

                      if (results.size() > 5) {
                          results =
                                  new ArrayList<>(
                                          results.subList(0, 5)
                                  );
                      }

                  } else {

                      Collections.sort(
                              results,
                              (a, b) ->
                                      Integer.compare(
                                              b.score,
                                              a.score
                                      )
                      );
                  }

                  if (outsideRadius) {

                      TextView notice = text(
                              "⚠️ 반경 " +
                                      radiusKm +
                                      "km 안에 등록된 샘플 콜지가 없어 가장 가까운 장소를 보여줍니다.",
                              13,
                              false,
                              Color.rgb(150, 90, 20)
                      );

                      notice.setPadding(
                              dp(5),
                              dp(4),
                              dp(5),
                              dp(12)
                      );

                      pointContainer.addView(notice);
                  }

                  for (ResultPoint result : results) {
                      addPointCard(result);
                  }
              }

              private void addPointCard(ResultPoint r) {

                  CallPoint p = r.point;

                  LinearLayout card =
                          new LinearLayout(this);

                  card.setOrientation(
                          LinearLayout.VERTICAL
                  );

                  card.setPadding(
                          dp(16),
                          dp(14),
                          dp(16),
                          dp(14)
                  );

                  card.setBackground(
                          cardBackground(Color.WHITE)
                  );

                  String level;

                  if (r.score >= 82) {
                      level = "🔥 강력";
                  } else if (r.score >= 68) {
                      level = "🟢 좋음";
                  } else {
                      level = "🟡 보통";
                  }

                  TextView name = text(
                          level + "  " + p.name,
                          18,
                          true,
                          Color.rgb(25, 25, 25)
                  );

                  card.addView(name);

                  TextView distance = text(
                          String.format(
                                  Locale.KOREA,
                                  "%.1fkm · 추천점수 %d점",
                                  r.distance,
                                  Math.max(0, r.score)
                          ),
                          14,
                          false,
                          Color.rgb(55, 90, 160)
                  );

                  distance.setPadding(
                          0,
                          dp(5),
                          0,
                          0
                  );

                  card.addView(distance);

                  TextView hours = text(
                          "⏰ 추천시간 " + p.hours,
                          14,
                          false,
                          Color.DKGRAY
                  );

                  hours.setPadding(
                          0,
                          dp(7),
                          0,
                          0
                  );

                  card.addView(hours);

                  TextView scores = text(
                          "서울복귀 " +
                                  stars(p.returnScore) +
                                  "   장거리 " +
                                  stars(p.longScore) +
                                  "\n지역콜 " +
                                  stars(p.localScore),
                          14,
                          false,
                          Color.DKGRAY
                  );

                  scores.setPadding(
                          0,
                          dp(6),
                          0,
                          0
                  );

                  card.addView(scores);

                  TextView memo = text(
                          p.memo,
                          13,
                          false,
                          Color.GRAY
                  );

                  memo.setPadding(
                          0,
                          dp(7),
                          0,
                          0
                  );

                  card.addView(memo);

                  Button map = new Button(this);
                  map.setText("🗺 지도에서 보기");
                  map.setAllCaps(false);

                  map.setOnClickListener(v ->
                          openMap(p)
                  );

                  card.addView(
                          map,
                          marginParams(
                                  0,
                                  9,
                                  0,
                                  0
                          )
                  );

                  pointContainer.addView(
                          card,
                          marginParams(
                                  0,
                                  0,
                                  0,
                                  12
                          )
                  );
              }

              private void openMap(CallPoint p) {

                  try {

                      String uri =
                              "geo:0,0?q=" +
                                      p.lat +
                                      "," +
                                      p.lon +
                                      "(" +
                                      Uri.encode(p.name) +
                                      ")";

                      Intent intent =
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(uri)
                              );

                      startActivity(intent);

                  } catch (ActivityNotFoundException e) {

                      Toast.makeText(
                              this,
                              "지도 앱을 찾지 못했습니다.",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private String stars(int count) {

                  StringBuilder s =
                          new StringBuilder();

                  for (int i = 0; i < 5; i++) {
                      s.append(
                              i < count ?
                                      "★" :
                                      "☆"
                      );
                  }

                  return s.toString();
              }

              private double distanceKm(
                      double lat1,
                      double lon1,
                      double lat2,
                      double lon2
              ) {

                  float[] result =
                          new float[1];

                  Location.distanceBetween(
                          lat1,
                          lon1,
                          lat2,
                          lon2,
                          result
                  );

                  return result[0] / 1000.0;
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults
              ) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode ==
                          LOCATION_REQUEST) {

                      if (grantResults.length > 0 &&
                              grantResults[0] ==
                                      PackageManager.PERMISSION_GRANTED) {

                          findLocation();

                      } else {

                          statusText.setText(
                                  "위치 권한이 필요합니다."
                          );

                          Toast.makeText(
                                  this,
                                  "콜나침반은 주변 콜지를 찾기 위해 위치 권한이 필요합니다.",
                                  Toast.LENGTH_LONG
                          ).show();
                      }
                  }
              }

