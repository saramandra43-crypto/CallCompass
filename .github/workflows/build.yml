name: Build CallCompass APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack project
        run: |
          rm -rf project
          mkdir project
          unzip -q CallCompass-v0.2-project.zip -d project
      - name: Fix result list type
        run: |
          FILE="project/app/src/main/java/com/callcompass/app/MainActivity.java"
          sed -i -E 's/(List|ArrayList)<P>([[:space:]]*shown)/\1<R>\2/g' "$FILE"
      - name: Build APK
        run: cd project && gradle assembleDebug

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk CallCompass-v0.2.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CallCompass-v0.2
          path: CallCompass-v0.2.apk
