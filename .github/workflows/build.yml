              private TextView text(
                      String value,
                      int size,
                      boolean bold,
                      int color
              ) {

                  TextView t =
                          new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);

                  if (bold) {
                      t.setTypeface(
                              null,
                              Typeface.BOLD
                      );
                  }

                  return t;
              }

              private GradientDrawable cardBackground(
                      int color
              ) {

                  GradientDrawable bg =
                          new GradientDrawable();

                  bg.setColor(color);
                  bg.setCornerRadius(dp(16));
                  bg.setStroke(
                          dp(1),
                          Color.rgb(
                                  225,
                                  227,
                                  232
                          )
                  );

                  return bg;
              }

              private LinearLayout.LayoutParams marginParams(
                      int left,
                      int top,
                      int right,
                      int bottom
              ) {

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  p.setMargins(
                          dp(left),
                          dp(top),
                          dp(right),
                          dp(bottom)
                  );

                  return p;
              }

              private int dp(int value) {

                  float density =
                          getResources()
                                  .getDisplayMetrics()
                                  .density;

                  return (int) (
                          value * density
                  );
              }

              static class CallPoint {

                  String name;
                  double lat;
                  double lon;
                  int baseScore;
                  String hours;

                  int returnScore;
                  int longScore;
                  int localScore;

                  String memo;

                  CallPoint(
                          String name,
                          double lat,
                          double lon,
                          int baseScore,
                          String hours,
                          int returnScore,
                          int longScore,
                          int localScore,
                          String memo
                  ) {

                      this.name = name;
                      this.lat = lat;
                      this.lon = lon;
                      this.baseScore = baseScore;
                      this.hours = hours;

                      this.returnScore =
                              returnScore;

                      this.longScore =
                              longScore;

                      this.localScore =
                              localScore;

                      this.memo = memo;
                  }
              }

              static class ResultPoint {

                  CallPoint point;
                  double distance;
                  int score;

                  ResultPoint(
                          CallPoint point,
                          double distance,
                          int score
                  ) {

                      this.point = point;
                      this.distance = distance;
                      this.score = score;
                  }
              }
          }
